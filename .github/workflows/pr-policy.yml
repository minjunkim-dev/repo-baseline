# Copy to .github/workflows/pr-policy.yml. The project owns this copy so Dependabot can update the pin.
# pull_request selects this file from the pull request. The job runs the script from the base commit when
# that commit has it, so a later pull request cannot replace workflow_policy.py or pr_author.py.
# The head copy runs only when the base commit has no script yet.
# pull_request_target is not used: the public repository allows that event only for review-status.yml.
# ready_for_review reruns the job when a draft becomes ready, even if the body was not edited.
# The body is read from the event JSON and parsed. It is not executed.
name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy-base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy-head
          persist-credentials: false
      - name: Check PR title, branch, and body
        run: |
          if [ -f policy-base/scripts/workflow_policy.py ]; then
            root=policy-base
          else
            root=policy-head
          fi
          python3 "$root/scripts/workflow_policy.py" --pr
