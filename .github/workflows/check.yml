name: Baseline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git diff --check
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_bugbot_rules.py'
      - run: python3 -m unittest discover -s scripts -p 'test_branch_name.py'
