name: Baseline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Live branch protection requires these two context names. Keep them until the owner changes protection (W7, #69).
  baseline:
    name: Baseline checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tools and layout
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Profiles
        run: |
          for d in profiles/review-gate profiles/pr-conventions profiles/hash-copy; do
            python3 -m unittest discover -s "$d" -p 'test_*.py'
          done
