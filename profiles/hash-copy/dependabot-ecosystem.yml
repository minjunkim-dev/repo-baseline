  - package-ecosystem: $ecosystem
    directory: $directory
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Seoul
    labels: [dependencies]
    # Wait a week before proposing a newly published version: fresh releases are where hijacked packages show up.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One weekly PR for minor and patch updates; each major update still gets its own PR.
      minor-and-patch:
        update-types: [minor, patch]
