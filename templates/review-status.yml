# Copy to .github/workflows/review-status.yml (POLICY.md §9). The project owns this copy so Dependabot can update the pin.
name: Review status

# pull_request_target runs this file and the script from the base branch, so a PR cannot change the code this job runs.
# Safe only while no step checks out or runs the PR head. `edited` re-runs the job when the PR base changes.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  review-status:
    name: Review status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required review statuses on this head
        run: python3 scripts/check_review_status.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
