# Example block. Paste it under `updates:` in .github/dependabot.yml once per package manager,
# then change package-ecosystem and directory. Values for package-ecosystem:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
  - package-ecosystem: npm   # e.g. npm, pip, uv, gomod, cargo, gradle, maven, bundler
    directory: /             # folder that holds the manifest
    schedule:
      interval: weekly
    labels: [dependencies]
    # Wait a week before proposing a newly published version: fresh releases are where hijacked packages show up.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One weekly PR for minor and patch updates; each major update still gets its own PR.
      minor-and-patch:
        update-types: [minor, patch]
